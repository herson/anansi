name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y --no-install-recommends nmap
        python -m pip install --upgrade pip
        pip install --require-hashes -r requirements.txt -r requirements-dev.txt

    - name: Check the lockfiles match their .in files
      run: ./scripts/lock-requirements.sh --check

    - name: Lint with flake8
      run: flake8 . --count --show-source --statistics

    - name: Type-check with mypy
      run: mypy

    - name: Security scan with bandit
      run: |
        bandit -r modules/ web/ main.py --severity-level medium -q

    - name: Audit dependencies with pip-audit
      run: |
        pip-audit -r requirements.txt --skip-editable

    - name: Test with unittest
      env:
        ANANSI_INTEGRATION: "1"
      run: |
        python -m unittest discover -s tests -t .

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Build image and smoke-test it
      run: ./scripts/docker-smoke.sh
