services:
  anansi:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    # Named volumes take their ownership from the image, so the non-root
    # app user can write to them (host bind mounts would be root-owned).
    volumes:
      - anansi-logs:/app/logs
      - anansi-data:/app/data
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - NVD_API_KEY=${NVD_API_KEY:-}
      - ANANSI_API_KEY=${ANANSI_API_KEY:?set ANANSI_API_KEY in .env}
    restart: unless-stopped

volumes:
  anansi-logs:
  anansi-data:
