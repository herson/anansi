default:
  max_threads: 10                   # Number of threads for multithreading
  report_format: "json"             # Output report format, can be json or csv
  exclude_ports: []                 # Ports to skip during scans, e.g. [9100]
  ai_model: "gpt-6-luna"            # Model for --ai analysis, as the endpoint names it
  # --ai sends scan data to OpenAI unless ai_base_url points elsewhere (see README).
  # ai_base_url: "http://localhost:11434/v1"   # e.g. a local Ollama; no key is sent
  # ai_api_key_env: "OPENROUTER_API_KEY"       # variable holding the key for ai_base_url
  # ai_token_parameter: "max_tokens"           # if the endpoint rejects max_completion_tokens
  # --dirs sends one request per wordlist entry to the URL given (ADR-0012).
  # dirs_rate: 10                              # requests per second, at most 50
  # dirs_verify_tls: false                     # for internal hosts with self-signed certificates
